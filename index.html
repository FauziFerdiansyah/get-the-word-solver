<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <!--
      Every absolute URL below comes from VITE_SITE_URL in .env, so a fork only
      edits that one line. robots.txt and sitemap.xml are generated from the same
      value by scripts/build-seo.mjs, which `npm run build` runs first.
    -->
    <title>Get The Word Solver — Jawaban Get The Word! 4, 5, 6 Huruf</title>
    <meta
      name="description"
      content="Cari jawaban Get The Word! secara instan. Masukkan huruf hijau, kuning, dan yang tidak ada, lalu dapat daftar kata 4, 5, atau 6 huruf yang diurutkan dari paling mungkin. Bisa juga untuk Wordle. Gratis dan jalan offline."
    />
    <meta
      name="keywords"
      content="get the word, get the word solver, jawaban get the word, kunci jawaban get the word, bantuan get the word, wordle solver, jawaban wordle, kata 4 huruf, kata 5 huruf, kata 6 huruf, teka teki kata"
    />
    <meta name="author" content="Fauzi Ferdiansyah" />
    <meta name="application-name" content="Get The Word Solver" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Get The Word Solver" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="Get The Word Solver — Jawaban Get The Word! 4, 5, 6 Huruf" />
    <meta
      property="og:description"
      content="Masukkan huruf hijau, kuning, dan yang tidak ada, lalu dapat daftar jawaban Get The Word! yang diurutkan dari paling mungkin. Bisa juga untuk Wordle."
    />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Logo Get The Word Solver" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_SITE_URL%" />
    <meta name="twitter:title" content="Get The Word Solver — Jawaban Get The Word! 4, 5, 6 Huruf" />
    <meta
      name="twitter:description"
      content="Masukkan huruf hijau, kuning, dan yang tidak ada, lalu dapat daftar jawaban Get The Word! yang diurutkan dari paling mungkin."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />
    <meta name="twitter:image:alt" content="Logo Get The Word Solver" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./word.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Get The Word Solver" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Get The Word Solver",
        "alternateName": "Jawaban Get The Word!",
        "url": "%VITE_SITE_URL%",
        "description": "Cari jawaban Get The Word! dan Wordle untuk kata 4, 5, dan 6 huruf, diurutkan dari yang paling mungkin jadi jawaban.",
        "applicationCategory": "GameApplication",
        "applicationSubCategory": "Word puzzle helper",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["id", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
        "image": "%VITE_SITE_URL%og-image.png",
        "screenshot": "%VITE_SITE_URL%og-image.png",
        "featureList": [
          "Jawaban untuk kata 4, 5, dan 6 huruf",
          "Mode 1 baris dan mode papan 6 baris seperti di game",
          "Saran diurutkan dari kata yang paling mungkin jadi jawaban",
          "Bekerja offline setelah dipasang",
          "Bahasa Indonesia dan Inggris"
        ],
        "author": {
          "@type": "Person",
          "name": "Fauzi Ferdiansyah",
          "url": "https://fauzi.is-a.dev/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Get The Word Solver membutuhkan JavaScript. Aktifkan JavaScript untuk mencari
      jawaban Get The Word! dan Wordle 4, 5, atau 6 huruf.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
